name: Production SP baseline
on:
  push:
    branches: [wip/g5-production-sp]
    paths: [tb/avr/production_sp.c, tb/avr/simavr-timer-top0.patch, tb/avr/simavr-timer-mask.patch, .github/workflows/g5-production-sp.yml, tb/compare/production_sp.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: buserror/simavr
          ref: 13d4ed32433ad7a37bb757b7e0f7dbb5373396c0
          path: simulator
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45878477195
          pattern: local-build-*
          path: input
      - name: Host tools only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc make libelf-dev pkg-config binutils-avr
      - name: Compile host and validate exact images
        run: |
          mkdir -p raw build
          git -C simulator rev-parse HEAD > raw/simulator.txt
          git -C simulator apply ../tb/avr/simavr-timer-top0.patch
          git -C simulator apply ../tb/avr/simavr-timer-mask.patch
          sha256sum tb/avr/simavr-timer-top0.patch tb/avr/simavr-timer-mask.patch simulator/simavr/sim/avr_timer.c tb/avr/production_sp.c > raw/hashes.txt
          nice -n 19 make -s -j1 -C simulator/simavr libsimavr RELEASE=1
          nice -n 19 gcc -std=c99 -Wall -Wextra -O2 -Isimulator/simavr/sim tb/avr/production_sp.c simulator/simavr/obj-x86_64-linux-gnu/libsimavr.a -lelf -lm -o build/production-sp
          python3 -I tb/compare/production_sp.py prepare input raw
      - name: Serial two-mode observed and blind baseline
        run: |
          for mode in g94 g93; do
            timeout 700 nice -n 19 build/production-sp raw/$mode.elf $mode raw/$mode-observed observed > raw/$mode-observed.log 2>&1
            timeout 700 nice -n 19 build/production-sp raw/$mode.elf $mode raw/$mode-blind blind > raw/$mode-blind.log 2>&1
          done
          python3 -I tb/compare/production_sp.py verify raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-sp-baseline
          path: raw
