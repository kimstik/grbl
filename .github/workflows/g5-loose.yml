name: G5 loose seed comparison

on:
  push:
    branches: [wip/z-loose-compare]
  workflow_dispatch:
    inputs:
      raw_run_id:
        description: 'Check identity using existing raw artifacts only; empty runs the full comparison'
        required: false
        type: string
      selector:
        description: 'Frozen selector native/static checks only; no AVR execution'
        required: false
        type: boolean
        default: false
      parser_scratch:
        description: 'Frozen parser scratch identity/static checks only; no AVR execution'
        required: false
        type: boolean
        default: false
      rms:
        description: 'Frozen RMS selector identity/static checks only; no AVR execution'
        required: false
        type: boolean
        default: false
      chords:
        description: 'Frozen finite-chord native/static checks only; no AVR execution'
        required: false
        type: boolean
        default: false
      square:
        description: 'Frozen integer-square native/static checks only; no AVR execution'
        required: false
        type: boolean
        default: false
      square_motion:
        description: 'Frozen square startup, raw accuracy and live motion against baseline/fixed/refill'
        required: false
        type: boolean
        default: false
      workspace:
        description: 'Frozen parser workspace full identity/static checks; no AVR execution'
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  workspace:
    if: ${{ inputs.workspace }}
    uses: ./.github/workflows/g5-parser.yml
    with:
      family: workspace

  square:
    if: ${{ inputs.square && !inputs.square_motion && !inputs.workspace }}
    uses: ./.github/workflows/g5-parser.yml
    with:
      family: square

  chords:
    if: ${{ inputs.chords && !inputs.square && !inputs.square_motion && !inputs.workspace }}
    uses: ./.github/workflows/g5-parser.yml
    with:
      family: chords

  rms:
    if: ${{ inputs.rms && !inputs.chords && !inputs.square && !inputs.square_motion && !inputs.workspace }}
    uses: ./.github/workflows/g5-parser.yml
    with:
      family: rms

  parser-scratch:
    if: ${{ inputs.parser_scratch && !inputs.rms && !inputs.chords && !inputs.square && !inputs.square_motion && !inputs.workspace }}
    uses: ./.github/workflows/g5-parser.yml

  avr:
    if: ${{ !inputs.workspace && (inputs.square_motion || (!inputs.raw_run_id && !inputs.selector && !inputs.parser_scratch && !inputs.rms && !inputs.chords && !inputs.square)) }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: baseline
            ref: 1f19d74940551ecfaa0c38c17a318aeda931d795
            extra: ''
          - arm: fixed
            ref: a9b415f1c120fa9e12156f8456984e0e32e38112
            extra: -DBEZIER_Z_FIXED
          - arm: refill
            ref: 8672b8f5091b0df7d0a8a34216d0cde8bb75d2ce
            extra: -DBEZIER_Z_FIXED -DBEZIER_Z_REFILL
          - arm: ${{ inputs.square_motion && 'square' || 'seed' }}
            ref: ${{ inputs.square_motion && 'a783b670fb96484c8bcd6e7aea94adb8b5172bf0' || 'fbea6f2456e48306d3bb8f6b5e49366b1ba94357' }}
            extra: ${{ inputs.square_motion && '-DBEZIER_Z_FIXED -DBEZIER_Z_REFILL -DBEZIER_PARSER_SCRATCH -DBEZIER_Z_CHORDS' || '-DBEZIER_Z_FIXED -DBEZIER_Z_REFILL -DBEZIER_Z_SEED' }}
    name: avr 16.2 ${{ matrix.arm }}
    steps:
      - name: Pinned AVR tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git make diffutils bash python curl
          a=https://archive.archlinux.org/packages/a
          mkdir -p "$RUNNER_TEMP/avr-packages"
          for package in \
            avr-binutils/avr-binutils-2.47-1-x86_64.pkg.tar.zst \
            avr-gcc/avr-gcc-16.2.0-1-x86_64.pkg.tar.zst \
            avr-libc/avr-libc-2.3.2-4-any.pkg.tar.zst; do
            curl --fail --location --ipv4 --http1.1 --retry 2 --retry-delay 5 \
              --connect-timeout 20 --max-time 120 \
              --output "$RUNNER_TEMP/avr-packages/${package##*/}" "$a/$package"
          done
          pacman -U --noconfirm "$RUNNER_TEMP"/avr-packages/*.pkg.tar.zst
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: source
      - name: Matched production images and measurement binaries
        run: timeout 1200 nice -n 19 bash tb/compare/build_loose.sh '${{ matrix.arm }}' '${{ matrix.extra }}'
      - name: Require square boot-region fit separately from motion evidence
        if: ${{ inputs.square_motion && matrix.arm == 'square' }}
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          rows = [line.split() for line in Path('raw/sizes.txt').read_text().splitlines()[1:]]
          assert len(rows) == 2 and {row[1] for row in rows} == {'g94', 'g93'}
          for row in rows:
              print(f'{row[1]}: flash={row[2]}, boot margin={row[5]}, full fit={row[6]}, boot fit={row[7]}', flush=True)
          assert all(row[0] == 'square' and int(row[2]) <= 32256 and row[6:] == ['yes', 'yes'] for row in rows), 'square exceeds ATmega328P boot flash region'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loose-avr-${{ matrix.arm }}
          path: |
            elf
            raw

  simavr:
    needs: avr
    if: ${{ !inputs.workspace && !cancelled() && (inputs.square_motion || (!inputs.raw_run_id && !inputs.selector && !inputs.parser_scratch && !inputs.rms && !inputs.chords && !inputs.square)) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(inputs.square_motion && '["baseline","fixed","refill","square"]' || '["baseline","fixed","refill","seed"]') }}
        mode: [g94, g93]
        include:
          - arm: baseline
            ref: 1f19d74940551ecfaa0c38c17a318aeda931d795
            extra: ''
          - arm: fixed
            ref: a9b415f1c120fa9e12156f8456984e0e32e38112
            extra: -DBEZIER_Z_FIXED
          - arm: refill
            ref: 8672b8f5091b0df7d0a8a34216d0cde8bb75d2ce
            extra: -DBEZIER_Z_FIXED -DBEZIER_Z_REFILL
          - arm: ${{ inputs.square_motion && 'square' || 'seed' }}
            ref: ${{ inputs.square_motion && 'a783b670fb96484c8bcd6e7aea94adb8b5172bf0' || 'fbea6f2456e48306d3bb8f6b5e49366b1ba94357' }}
            extra: ${{ inputs.square_motion && '-DBEZIER_Z_FIXED -DBEZIER_Z_REFILL -DBEZIER_PARSER_SCRATCH -DBEZIER_Z_CHORDS' || '-DBEZIER_Z_FIXED -DBEZIER_Z_REFILL -DBEZIER_Z_SEED' }}
    name: simavr ${{ matrix.arm }} ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: loose-avr-${{ matrix.arm }}
          path: input
      - name: Install simavr
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends simavr
      - name: Same corpus, raw accuracy, timing and live motion
        run: timeout 3600 nice -n 19 bash tb/compare/run_loose.sh '${{ matrix.arm }}' '${{ matrix.mode }}' '${{ matrix.extra }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loose-simavr-${{ matrix.arm }}-${{ matrix.mode }}
          path: raw

  identity:
    needs: simavr
    if: ${{ !inputs.workspace && !cancelled() && (inputs.square_motion || (!inputs.selector && !inputs.parser_scratch && !inputs.rms && !inputs.chords && !inputs.square)) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    name: raw target identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: loose-simavr-*
          path: input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw_run_id || github.run_id }}
      - name: Directed identity controls
        run: timeout 120 nice -n 19 python3 -I tb/compare/check_loose_identity_controls.py input/loose-simavr-baseline-g94
      - name: Check full outputs or XY, feed and condition against the frozen reference
        run: |
          set -euo pipefail
          mkdir -p raw
          failed=0
          arms=(refill seed)
          if [ '${{ inputs.square_motion }}' = true ]; then arms=(refill square); fi
          for mode in g94 g93; do
            for arm in "${arms[@]}"; do
              reference=fixed
              extra=()
              if [ "$arm" = seed ]; then reference=refill; extra=(--xy-only); fi
              if [ "$arm" = square ]; then
                reference=refill
                [ "$mode" != g94 ] || extra=(--xy-only)
              fi
              current="input/loose-simavr-$arm-$mode"
              previous="input/loose-simavr-$reference-$mode"
              log="raw/identity-$arm-$mode.txt"
              if ! cmp "$current/corpus.txt" "$previous/corpus.txt" > "$log" 2>&1; then
                failed=1
              elif ! python3 -I tb/compare/check_loose.py "$current/corpus.txt" "$current/bench.txt" \
                  --dump "$current/dump.txt" --reference "$previous/dump.txt" "${extra[@]}" >> "$log" 2>&1; then
                failed=1
              fi
              cat "$log"
              cat "$log" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loose-identity
          path: raw

  observe:
    needs: avr
    if: ${{ !inputs.workspace && !cancelled() && (inputs.square_motion || (!inputs.raw_run_id && !inputs.selector && !inputs.parser_scratch && !inputs.rms && !inputs.chords && !inputs.square)) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [g94, g93]
    name: live refill observation ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: buserror/simavr
          ref: 13d4ed32433ad7a37bb757b7e0f7dbb5373396c0
          path: simulator
      - uses: actions/download-artifact@v4
        with:
          name: loose-avr-baseline
          path: input/baseline
      - uses: actions/download-artifact@v4
        with:
          name: loose-avr-fixed
          path: input/fixed
      - uses: actions/download-artifact@v4
        with:
          name: loose-avr-refill
          path: input/refill
      - uses: actions/download-artifact@v4
        with:
          name: loose-avr-${{ inputs.square_motion && 'square' || 'seed' }}
          path: input/${{ inputs.square_motion && 'square' || 'seed' }}
      - name: Host observer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc make pkg-config libelf-dev gcc-avr avr-libc
      - name: Compare initial-pass policies and refill identity with blind controls
        run: timeout 3000 nice -n 19 bash tb/compare/run_observe.sh '${{ matrix.mode }}' baseline fixed refill '${{ inputs.square_motion && 'square' || 'seed' }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loose-observe-${{ matrix.mode }}
          path: raw

  selector-native:
    if: ${{ inputs.selector && !inputs.parser_scratch && !inputs.rms && !inputs.chords && !inputs.square && !inputs.square_motion && !inputs.workspace }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: selector native identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1f19d74940551ecfaa0c38c17a318aeda931d795
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: 8672b8f5091b0df7d0a8a34216d0cde8bb75d2ce
          path: refill
      - uses: actions/checkout@v4
        with:
          ref: fbea6f2456e48306d3bb8f6b5e49366b1ba94357
          path: seed
      - uses: actions/checkout@v4
        with:
          ref: 452c70dc7809edb2e16e03a6707c197fc535fbbd
          path: select
      - name: Raw parser outputs, selected policies and actual G93 identity
        run: |
          set -euo pipefail
          timeout 600 nice -n 19 python3 -I tb/compare/select_native.py \
            --baseline baseline --refill refill --seed seed --select select --output raw/native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selector-native
          path: raw/native

  selector-avr:
    if: ${{ inputs.selector && !inputs.parser_scratch && !inputs.rms && !inputs.chords && !inputs.square && !inputs.square_motion && !inputs.workspace }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [g94, g93]
    name: selector AVR 16.2 ${{ matrix.mode }}
    steps:
      - name: Pinned AVR tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git make diffutils bash python curl
          a=https://archive.archlinux.org/packages/a
          mkdir -p "$RUNNER_TEMP/avr-packages"
          for package in \
            avr-binutils/avr-binutils-2.47-1-x86_64.pkg.tar.zst \
            avr-gcc/avr-gcc-16.2.0-1-x86_64.pkg.tar.zst \
            avr-libc/avr-libc-2.3.2-4-any.pkg.tar.zst; do
            curl --fail --location --ipv4 --http1.1 --retry 2 --retry-delay 5 \
              --connect-timeout 20 --max-time 120 \
              --output "$RUNNER_TEMP/avr-packages/${package##*/}" "$a/$package"
          done
          pacman -U --noconfirm "$RUNNER_TEMP"/avr-packages/*.pkg.tar.zst
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 1f19d74940551ecfaa0c38c17a318aeda931d795
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: 8672b8f5091b0df7d0a8a34216d0cde8bb75d2ce
          path: refill
      - uses: actions/checkout@v4
        with:
          ref: 452c70dc7809edb2e16e03a6707c197fc535fbbd
          path: select
      - name: Normal production link, macro-off identity and static overflow evidence
        run: timeout 900 nice -n 19 bash tb/compare/build_select.sh '${{ matrix.mode }}'
      - name: Require boot-region fit; static inspection does not waive overflow
        run: |
          set -euo pipefail
          python3 -I tb/compare/check_select_fit.py raw --mode '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selector-avr-${{ matrix.mode }}
          path: raw
