name: G5 loose prefetch comparison

on:
  push:
    branches: [wip/z-loose-compare]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  avr:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: baseline
            ref: 1f19d74940551ecfaa0c38c17a318aeda931d795
            extra: ''
          - arm: prefetch
            ref: 937229f0b9897cf0ad37f9d602b768ec985215e1
            extra: -DBEZIER_Z_PREFETCH
    name: avr 16.2 ${{ matrix.arm }}
    steps:
      - name: Pinned AVR tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git make diffutils bash python
          a=https://archive.archlinux.org/packages/a
          pacman -U --noconfirm \
            $a/avr-binutils/avr-binutils-2.47-1-x86_64.pkg.tar.zst \
            $a/avr-gcc/avr-gcc-16.2.0-1-x86_64.pkg.tar.zst \
            $a/avr-libc/avr-libc-2.3.2-4-any.pkg.tar.zst
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: source
      - name: Matched production images and measurement binaries
        run: timeout 1200 nice -n 19 bash tb/compare/build_loose.sh '${{ matrix.arm }}' '${{ matrix.extra }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loose-avr-${{ matrix.arm }}
          path: |
            elf
            raw

  simavr:
    needs: avr
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arm: [baseline, prefetch]
        mode: [g94, g93]
        include:
          - arm: baseline
            ref: 1f19d74940551ecfaa0c38c17a318aeda931d795
            extra: ''
          - arm: prefetch
            ref: 937229f0b9897cf0ad37f9d602b768ec985215e1
            extra: -DBEZIER_Z_PREFETCH
    name: simavr ${{ matrix.arm }} ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: loose-avr-${{ matrix.arm }}
          path: input
      - name: Install simavr
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends simavr
      - name: Same corpus, raw accuracy, timing and live motion
        run: timeout 3600 nice -n 19 bash tb/compare/run_loose.sh '${{ matrix.arm }}' '${{ matrix.mode }}' '${{ matrix.extra }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loose-simavr-${{ matrix.arm }}-${{ matrix.mode }}
          path: raw

  observe:
    needs: avr
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [g94, g93]
    name: live prefetch observation ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: buserror/simavr
          ref: 13d4ed32433ad7a37bb757b7e0f7dbb5373396c0
          path: simulator
      - uses: actions/download-artifact@v4
        with:
          name: loose-avr-baseline
          path: input/baseline
      - uses: actions/download-artifact@v4
        with:
          name: loose-avr-prefetch
          path: input/prefetch
      - name: Host observer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc make pkg-config libelf-dev gcc-avr avr-libc
      - name: Observe uninstrumented live code and check blind controls
        run: timeout 1800 nice -n 19 bash tb/compare/run_observe.sh '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loose-observe-${{ matrix.mode }}
          path: raw
