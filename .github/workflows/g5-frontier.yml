name: G5 ordinary motion frontier
on:
  workflow_dispatch:
  push:
    branches: [wip/g5-motion-frontier]
    paths:
      - .github/workflows/g5-frontier.yml
      - tb/avr/frontier.c
      - tb/compare/frontier_*.py
      - tb/compare/frontier_run.sh
permissions:
  contents: read
  actions: read
jobs:
  frontier:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 55
    steps:
      - name: Pinned AVR tools and host dependencies
        run: |
          set -eu
          pacman -Syu --noconfirm --needed git make diffutils bash python curl gcc pkgconf libelf which
          mkdir -p "$RUNNER_TEMP/avr-packages"
          for package in avr-binutils/avr-binutils-2.47-1-x86_64.pkg.tar.zst avr-gcc/avr-gcc-16.2.0-1-x86_64.pkg.tar.zst avr-libc/avr-libc-2.3.2-4-any.pkg.tar.zst; do
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 --output "$RUNNER_TEMP/avr-packages/${package##*/}" "https://archive.archlinux.org/packages/a/$package"
          done
          pacman -U --noconfirm "$RUNNER_TEMP"/avr-packages/*.pkg.tar.zst
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9b4a28f19137ef3cc2b9fca4dc464469483562e4
          path: frozen-harness
      - uses: actions/checkout@v4
        with:
          ref: 1f19d74940551ecfaa0c38c17a318aeda931d795
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: acc353d03e1e058383aa1ed39948a81e63f70906
          path: norm
      - uses: actions/checkout@v4
        with:
          repository: buserror/simavr
          ref: 13d4ed32433ad7a37bb757b7e0f7dbb5373396c0
          path: simulator
      - uses: actions/download-artifact@v4
        with:
          run-id: 45624751115
          github-token: ${{ github.token }}
          name: loose-avr-baseline
          path: retained/baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 45624751115
          github-token: ${{ github.token }}
          name: loose-avr-norm
          path: retained/norm
      - uses: actions/download-artifact@v4
        with:
          run-id: 45624751115
          github-token: ${{ github.token }}
          name: loose-simavr-baseline-g94
          path: distro/baseline
      - uses: actions/download-artifact@v4
        with:
          run-id: 45624751115
          github-token: ${{ github.token }}
          name: loose-simavr-norm-g94
          path: distro/norm
      - name: Fresh identical firmware and host-only observation
        run: timeout 2700 nice -n 19 bash tb/compare/frontier_run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordinary-frontier
          path: raw
