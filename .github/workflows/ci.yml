name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast, toolchain-free doc-integrity check: CONTRACTS.md section numbers
  # must be unique/sequential, every heading needs its stable slug anchor,
  # and every #slug cross-reference (in CONTRACTS.md or any other repo doc)
  # must resolve. Catches the "parallel agents both picked section 20"
  # class of bug at PR time instead of at manual integration.
  docs-integrity:
    name: docs integrity (CONTRACTS.md numbering)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CONTRACTS.md numbering/cross-reference check
        run: python3 tools/check_contracts_numbering.py
      # config.h/platform.h single-owner macro guard (BUG #25 class,
      # CONTRACTS.md #gpio-pin-map-single-owner). Added 2026-07-26 after an
      # independent sweep found samd21's LIMIT_MASK defined in both files
      # with no preceding #undef - the exact silent-shadow mechanism this
      # contract exists to catch, undetected until an audit went looking.
      # No toolchain needed (pure text/regex over the tree), so it lives
      # here rather than in a per-port build job.
      - name: config.h/platform.h macro single-owner check
        run: python3 ci/pinmap_overlap_check.py
      # Pure-logic unit tests for the sixth ratchet's manifest-format/hash-
      # compare machinery (no compiler invoked - same "no toolchain needed"
      # shape as the numbering check above, so it lives in this job rather
      # than idling a toolchain-having job on it). Wired in per adversarial
      # review: `tools/build_artifacts.py check` existed but was never
      # invoked anywhere in this file before this batch - see
      # CONTRACTS.md #build-artifacts-tracked "GAP 2 FIX".
      - name: Build-artifacts manifest/hash-compare selftest
        run: python3 tools/build_artifacts.py --selftest

  # Pure-logic unit tests for the post-link ratchets. No toolchain, no
  # compiler - each script builds synthetic `nm` output covering the exact
  # historical defect it exists to catch and asserts it is still caught.
  # The BUG #23 leg feeds init_check.sh the verbatim pre-fix stm32f103
  # symbol table (Reset_Handler + main, init chain LTO-deleted); a
  # regression that made the matcher permissive would pass every port build
  # silently, so it is checked here rather than only implicitly at link time.
  ratchet-selftests:
    name: ratchet selftests (no toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot-init reachability check selftest (BUG #23)
        run: make -C grbl/platform init-check-selftest
      - name: FP=SINGLE no-DP assert selftest
        run: sh tools/assert_no_double.sh --selftest
      - name: Warning ratchet selftest
        run: python3 ci/warn_ratchet.py --selftest
      - name: Segment conformance selftest
        run: python3 ci/seg_conformance.py --selftest
      - name: Macro single-owner check selftest (BUG #25 class)
        run: python3 ci/pinmap_overlap_check.py --selftest
      - name: Artifact tooling selftest
        run: make -C grbl/platform artifacts-selftest

  # NINTH RATCHET. Compiles grbl/stepper.c - the frozen consumer - straight out
  # of the tree with the HOST cc (no cross toolchain, which is why this is its
  # own fast job rather than a leg of a platform row), replays the committed
  # SEGX/1 vector corpus through the real ISR, and gates three things: the
  # replay equals the committed goldens, every registered candidate executor
  # equals the oracle bit-exactly, and the vector count only grows.
  #
  # It fails on any observable change to the frozen consumer - Bresenham, AMASS
  # shift, invert-mask timing, homing-lock placement, probe sample order, drain
  # sequencing, tick period accounting - and on a hand-edited golden. All three
  # gates were verified by breaking what they guard; the verbatim output is in
  # grbl/platform/docs/SEGMENT-CONFORMANCE.md.
  #
  # NEVER add --regen here. Regenerating goldens is a deliberate act.
  seg-conformance:
    name: segment conformance (hosted oracle, no cross toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replay the corpus through the frozen ISR and diff every subject
        run: python3 ci/seg_conformance.py

  # One matrix row per platform/board/flavor; adding a port = one new row
  # (plus its ci/warn_baseline_<platform>.txt, which may start empty).
  build:
    name: ${{ matrix.platform }}${{ matrix.board && format(' {0}', matrix.board) || '' }} ${{ matrix.build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # atmega328p reference build has a single flavor (-Os, no BUILD knob)
          - platform: atmega328p
            build: RELEASE
            toolchain-packages: gcc-avr avr-libc binutils-avr
          - platform: stm32f103
            build: DEBUG
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: stm32f103
            build: RELEASE
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: stm32h523
            build: DEBUG
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: stm32h523
            build: RELEASE
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: stm32f411
            build: DEBUG
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: stm32f411
            build: RELEASE
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: samd21
            board: megarm
            build: DEBUG
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: samd21
            board: megarm
            build: RELEASE
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: samd21
            board: generic
            build: DEBUG
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: samd21
            board: generic
            build: RELEASE
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: ch32v006
            board: generic
            build: DEBUG
            toolchain-packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          - platform: ch32v006
            board: generic
            build: RELEASE
            toolchain-packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          - platform: hc32f460
            build: DEBUG
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: hc32f460
            build: RELEASE
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: ch570
            board: generic
            build: DEBUG
            toolchain-packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          - platform: ch570
            board: generic
            build: RELEASE
            toolchain-packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          # sg2002 (Sophgo C906L runtime core). SAME two apt packages as the
          # other two RISC-V ports - no new toolchain story, so these rows are
          # NOT continue-on-error. The port is rv64imac/lp64, and that multilib
          # ships in the stock picolibc-riscv64-unknown-elf package (verified:
          # /usr/lib/picolibc/riscv64-unknown-elf/lib/rv64imac/lp64/libc.a). The
          # rv64gc/lp64d multilib does NOT ship, which is exactly why this port
          # does not use it - see grbl/platform/sg2002/Makefile's ARCH/ABI note.
          # The port's UNVERIFIED register facts are a HARDWARE risk, not a
          # build risk: nothing about them can make the compile or link flaky.
          - platform: sg2002
            board: generic
            build: DEBUG
            toolchain-packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          - platform: sg2002
            board: generic
            build: RELEASE
            toolchain-packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        uses: ./.github/actions/build-platform
        with:
          platform: ${{ matrix.platform }}
          board: ${{ matrix.board }}
          build: ${{ matrix.build }}
          toolchain-packages: ${{ matrix.toolchain-packages }}

      # Fails on warnings absent from the checked-in baseline (one-way
      # ratchet). Runs inside the build job because handing the log to a
      # separate job would need actions/download-artifact, which is outside
      # the allowed action set.
      - name: Warning ratchet
        run: >
          python3 ci/warn_ratchet.py
          --log '${{ steps.build.outputs.log }}'
          --baseline 'ci/warn_baseline_${{ matrix.platform }}.txt'

      # Golden gate (BLOCKING): byte-exact reference build integrity.
      # make validate checks grbl.hex MD5 against the golden hash
      # (79af184e67b27defd27a39309ac53563, see grbl/platform/common/chk.py).
      - name: Golden gate (make validate)
        if: matrix.platform == 'atmega328p'
        run: make -C grbl/platform/atmega328p validate

      # Sixth ratchet (build-artifacts freshness), wired in per adversarial
      # review - `tools/build_artifacts.py check` existed and was documented
      # as "the sixth ratchet" but no job in this file ever ran it
      # (`grep -n build_artifacts .github/workflows/ci.yml` returned
      # nothing before this). `check` needs every toolchain (ARM/AVR/
      # RISC-V/xc-dsc) to rebuild everything, which no single job here has -
      # a dedicated all-toolchains job would either re-install every
      # toolchain already installed by this matrix (duplicated install
      # cost, zero new coverage) or need actions/download-artifact to move
      # binaries between jobs (outside this workflow's allowed action set -
      # see the build-dspic33ak128mc102 job's own comment on why IT isn't
      # folded into build-platform for the identical reason in reverse).
      # Instead: each row runs `check --platforms <its own unit(s)>` using
      # the ONE toolchain it already has on PATH, right after already
      # building that unit once this run - partial-but-full-matrix
      # coverage at zero extra toolchain-install cost. Gated to the RELEASE
      # row only: `check` always rebuilds BOTH DEBUG and RELEASE fresh
      # regardless of which matrix row triggers it (see
      # tools/build_artifacts.py's do_check), so running it from both rows
      # of the same platform would just double-compile for no extra
      # coverage; atmega328p has only one row (RELEASE, no DEBUG flavor on
      # this port) so the same condition covers it too.
      - name: Artifacts freshness ratchet (tools/build_artifacts.py check)
        if: matrix.build == 'RELEASE'
        run: |
          unit="${{ matrix.platform }}"
          # samd21 is the one platform where the CI matrix's platform+board
          # pair maps to TWO distinct build_artifacts.py unit keys
          # (samd21-megarm / samd21-generic - see that script's UNITS table
          # comment: the toolchain names both boards' ELF identically, so
          # the unit key/artifact_dir is what disambiguates them). Every
          # other platform's unit key is just its own name.
          if [ "${{ matrix.platform }}" = "samd21" ]; then
            unit="samd21-${{ matrix.board }}"
          fi
          python3 tools/build_artifacts.py check --platforms "$unit"

  # dspic33ak128mc102: deliberately NOT a row in the `build` matrix above.
  # Every other platform's toolchain is `apt-get install <packages>` (see
  # build-platform/action.yml "Install toolchain" step) - a single stateless
  # command with nothing to cache and nothing to verify beyond apt's own
  # package signing. XC-DSC is the opposite shape on every axis: an 83 MB
  # vendor .run installer fetched over plain HTTPS from Microchip (not a
  # package registry), an unattended-install flag sequence with one
  # undocumented-but-required flag, a SEPARATELY fetched 15 MB Device Family
  # Pack, and (this project's own stated "favourite failure class") no
  # integrity guarantee at all unless CI checks the SHA-256 itself. Bending
  # build-platform's single apt-get step to cover this with an
  # `if: inputs.platform == 'dspic33ak128mc102'` branch would smuggle a
  # fetch/cache/verify/unattended-install pipeline into an action whose only
  # job today is "run apt-get" - worse for every future apt-based port
  # reading that file. A dedicated job keeps the composite action honestly
  # apt-only and keeps all of the dsPIC-specific ceremony in one place a
  # reviewer can read top to bottom.
  #
  # EULA: XC-DSC FreeMode is licensed for unattended/CI use - owner-approved
  # 2026-07-24 (PLAN.md Decision Log, "OWNER DIRECTIVES 2026-07-24").
  #
  # FIXED (was KNOWN GAP): the landed Makefile's $(HEX_FILE) rule used to
  # invoke `$(BIN2HEX) $<` without `-mdfp=`, but xc-dsc-bin2hex (like
  # xc-dsc-nm/objdump) hard-requires `-mdfp=<DFP path>` to resolve device
  # SFR/memory info, so `make BUILD=... all` failed at the hex step for
  # both flavors (only `make BUILD=... link` worked). The Makefile's
  # $(HEX_FILE) rule now passes `-mdfp=$(DFP_XC16)` like every other tool
  # invocation that needs it - `all` builds the full ELF+hex directly, no
  # workflow-level bin2hex workaround needed anymore. Re-verified end to
  # end this session: both flavors' `all` complete, hex checksums valid,
  # extents plausible for 128 KB flash (PLAN.md follow-up closed).
  build-dspic33ak128mc102:
    name: dspic33ak128mc102 ${{ matrix.build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [DEBUG, RELEASE]
    env:
      # Recipe + hashes: PLAN.md Decision Log ("TOOLCHAIN RECON") and this
      # port's own Makefile header comment, re-verified end-to-end (real
      # download + sha256sum + unattended install + build both flavors)
      # while wiring this job - see task's returned proof log.
      XC_DSC_URL: https://ww1.microchip.com/downloads/aemDocuments/documents/DEV/ProductDocuments/SoftwareTools/xc-dsc-v3.30-full-install-linux64-installer.run
      XC_DSC_SHA256: 0df20c1a552bf0ce08aa139b9cb1efd71bf65b9d9f37e3982763f4f8738bfa11
      DFP_URL: https://packs.download.microchip.com/Microchip.dsPIC33AK-MC_DFP.1.5.263.atpack
      # DFP SHA-256 was NOT in the original Decision Log recipe (only the
      # installer's was) - captured this session from a real download,
      # cross-checked against the server's own `x-amz-meta-sha256` response
      # header (independent source, same value): both read
      # 811360fb86d92e3d4519dab3948bf895e8468b37ab7203a7d5ca2bfac2b07bbb.
      DFP_SHA256: 811360fb86d92e3d4519dab3948bf895e8468b37ab7203a7d5ca2bfac2b07bbb
      XC_DSC_PREFIX: /opt/xc-dsc
      # Must match tools/build_artifacts.py's UNITS table DFP_PATH exactly
      # (that table hard-codes the make variable it passes for this unit,
      # it does not read this env var) - so that the "Artifacts freshness
      # ratchet" step below, which shells out to that same script, finds
      # the DFP where the script expects it instead of failing on a path
      # this job unzipped to but the script never looks at. Renamed from
      # the previous `/opt/dspic33ak-mc-dfp` (harmless - a fresh unzip
      # target directory name, nothing else in this job or repo referenced
      # the old string; verified via repo-wide grep before renaming) when
      # the ratchet was wired in (adversarial review, see
      # CONTRACTS.md #build-artifacts-tracked "GAP 2 FIX").
      DFP_PATH: /opt/Microchip.dsPIC33AK-MC_DFP.1.5.263
      DL_DIR: ${{ github.workspace }}/.dl-cache
    steps:
      - uses: actions/checkout@v4

      # Two independent caches, keyed on version+SHA (not just version): if
      # Microchip ever reshuffles a "same version" file, the hash changes,
      # the key misses, and the corrupted-download check below still runs
      # against the freshly re-fetched file instead of trusting a stale
      # cache entry silently. Cold run: both miss, ~100 MB downloaded. Warm
      # run (normal push, nothing toolchain-related changed): both hit,
      # zero download - restore is a local tar unpack, not a network fetch.
      # DEBUG and RELEASE share the same key (same installer/DFP) and run
      # concurrently: the two matrix legs racing to *save* the same key on
      # a cold run is expected and benign (actions/cache no-ops the loser,
      # does not fail the job); both still restore correctly on every
      # later run once either one has populated it.
      - name: Cache XC-DSC installer
        id: cache-installer
        uses: actions/cache@v4
        with:
          path: ${{ env.DL_DIR }}/xc-dsc-installer.run
          key: xc-dsc-installer-v3.30-${{ env.XC_DSC_SHA256 }}

      - name: Cache dsPIC33AK-MC DFP
        id: cache-dfp
        uses: actions/cache@v4
        with:
          path: ${{ env.DL_DIR }}/dspic33ak-mc-dfp.atpack
          key: dspic33ak-mc-dfp-1.5.263-${{ env.DFP_SHA256 }}

      - name: Download XC-DSC installer (cache miss only)
        if: steps.cache-installer.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$DL_DIR"
          curl -fsSL --retry 3 -o "$DL_DIR/xc-dsc-installer.run" "$XC_DSC_URL"

      - name: Download dsPIC33AK-MC DFP (cache miss only)
        if: steps.cache-dfp.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$DL_DIR"
          curl -fsSL --retry 3 -o "$DL_DIR/dspic33ak-mc-dfp.atpack" "$DFP_URL"

      # BLOCKING integrity check, unconditional (cache hit AND miss): a
      # corrupted download that still "installs" without complaint is
      # exactly the failure class this project has been burned by before
      # (see ci/warn_ratchet.py's own history). Re-checked every run, even
      # from cache, so a poisoned/altered cache entry fails loudly here
      # instead of silently "installing" downstream.
      - name: Verify installer + DFP SHA-256
        run: |
          echo "${XC_DSC_SHA256}  ${DL_DIR}/xc-dsc-installer.run" | sha256sum -c -
          echo "${DFP_SHA256}  ${DL_DIR}/dspic33ak-mc-dfp.atpack" | sha256sum -c -

      # Unattended install (fast: local file, no network) - `--netservername
      # ""` is REQUIRED though undocumented (installer hangs/fails without
      # it on a headless runner; verified this session).
      - name: Install XC-DSC (unattended, FreeMode - EULA approved for CI, PLAN.md Decision Log)
        run: |
          chmod +x "$DL_DIR/xc-dsc-installer.run"
          "$DL_DIR/xc-dsc-installer.run" \
            --mode unattended --unattendedmodeui none \
            --prefix "$XC_DSC_PREFIX" --LicenseType FreeMode \
            --ModifyAll 0 --netservername ""
          "$XC_DSC_PREFIX/bin/xc-dsc-gcc" --version

      - name: Unpack DFP (Apache-2.0; .atpack is a plain zip)
        run: |
          mkdir -p "$DFP_PATH"
          unzip -q "$DL_DIR/dspic33ak-mc-dfp.atpack" -d "$DFP_PATH"
          test -f "$DFP_PATH/xc16/support/dsPIC33A/gld/p33AK128MC102.gld"

      - name: "Build (make all - full ELF+hex, Makefile hex-step fix landed)"
        id: build
        run: |
          tag="dspic33ak128mc102-${{ matrix.build }}"
          log="build/${tag}.log"
          # Plain if/then, NOT `$( [ x = y ] && echo z )`: that pattern's
          # command substitution exits nonzero whenever the test is false
          # (no `echo` runs to swallow it), and GitHub Actions runs `run:`
          # under `bash -eo pipefail` by default - so on RELEASE the `&&`
          # short-circuit would silently kill this step before make even
          # starts. Caught locally while proving this exact script end to
          # end (see task's returned proof log) - a smaller instance of
          # this project's own "favourite failure class."
          suffix=""
          if [ "${{ matrix.build }}" = "DEBUG" ]; then suffix="_dbg"; fi
          elf="build/grbl_dspic33ak128mc102${suffix}.elf"
          mkdir -p build
          make -C grbl/platform/dspic33ak128mc102 \
            BUILD=${{ matrix.build }} \
            TOOLCHAIN_PATH="$XC_DSC_PREFIX/bin" DFP_PATH="$DFP_PATH" \
            all 2>&1 | tee "$log"
          echo "log=$log" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "elf=$elf" >> "$GITHUB_OUTPUT"

      # Assert step: zero PORT_TODO_* is this port's own Definition-of-Done
      # (Makefile `link` target comment / PLAN.md "zero PORT_TODO_*"
      # entries) - enforced here since there is no Renode/emulator boot
      # check for dsPIC33A (none exists for this core - PLAN.md/CONTRACTS
      # §16 both say so explicitly), so this nm-based assert IS this
      # platform's boot-check-equivalent gate.
      - name: Assert zero PORT_TODO_* (linker-as-checklist, Definition-of-Done)
        run: |
          elf="${{ steps.build.outputs.elf }}"
          if "$XC_DSC_PREFIX/bin/xc-dsc-nm" -mdfp="$DFP_PATH/xc16" "$elf" | grep -q PORT_TODO; then
            echo "::error::PORT_TODO_* symbols remain - port is not actually done"
            "$XC_DSC_PREFIX/bin/xc-dsc-nm" -mdfp="$DFP_PATH/xc16" "$elf" | grep PORT_TODO
            exit 1
          fi

      - name: Warning ratchet
        run: >
          python3 ci/warn_ratchet.py
          --log '${{ steps.build.outputs.log }}'
          --baseline 'ci/warn_baseline_dspic33ak128mc102.txt'

      # RELEASE-only note (not enforced as a check - there is nothing to
      # assert against without a licensed compiler): xc-dsc-gcc FreeMode
      # prints "Options have been disabled due to restricted license" on
      # every -Os translation unit instead of failing. This means RELEASE
      # is -O2-equivalent codegen, not true -Os (FreeMode silently
      # substitutes -O2 for -O3/-Os - settled by codegen comparison: an
      # explicit -O2 whole-firmware rebuild is byte-identical to this
      # RELEASE artifact). It does NOT make the size figure approximate -
      # the byte count is exact and reproducible (platform.md says the
      # same).
      - name: RELEASE size note (free-tier -Os is -O2-equivalent codegen)
        if: matrix.build == 'RELEASE'
        run: |
          echo "::notice::dsPIC33AK128MC102 RELEASE built with XC-DSC FreeMode: -Os is silently substituted with -O2-equivalent codegen ('Options have been disabled due to restricted license'). The build's size is exact and reproducible, but it is -O2, not true -Os."
          grep -c "Options have been disabled due to restricted license" "${{ steps.build.outputs.log }}" || true

      # Sixth ratchet, wired in per adversarial review - see the `build`
      # job's matching step for the full "why here, why RELEASE-gated"
      # rationale (identical reasoning: check rebuilds BOTH flavors fresh
      # regardless of which row triggers it, so one row per platform is
      # correct, not redundant). This unit's .elf is exempt from the hash
      # comparison (nondeterministic_elf - see tools/build_artifacts.py's
      # UNITS table comment: embedded compiler-tempfile section names, not
      # code); hex/bin/syms ARE hash-gated here exactly like every other
      # unit, for both DEBUG and RELEASE.
      - name: Artifacts freshness ratchet (tools/build_artifacts.py check)
        if: matrix.build == 'RELEASE'
        run: python3 tools/build_artifacts.py check --platforms dspic33ak128mc102

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grbl-${{ steps.build.outputs.tag }}
          path: |
            build/*.hex
            build/*.elf
            build/*.map
            build/*.log
          if-no-files-found: error
