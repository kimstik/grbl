name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One matrix row per platform/board/flavor; adding a port = one new row
  # (plus its ci/warn_baseline_<platform>.txt, which may start empty).
  # Example future row: platform sg2002 with gcc-riscv64-unknown-elf.
  build:
    name: ${{ matrix.platform }}${{ matrix.board && format(' {0}', matrix.board) || '' }} ${{ matrix.build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # atmega328p reference build has a single flavor (-Os, no BUILD knob)
          - platform: atmega328p
            build: RELEASE
            toolchain-packages: gcc-avr avr-libc binutils-avr
          - platform: stm32f103
            build: DEBUG
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: stm32f103
            build: RELEASE
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: stm32h523
            build: DEBUG
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: stm32h523
            build: RELEASE
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: samd21
            board: megarm
            build: DEBUG
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: samd21
            board: megarm
            build: RELEASE
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: samd21
            board: generic
            build: DEBUG
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: samd21
            board: generic
            build: RELEASE
            toolchain-packages: gcc-arm-none-eabi libnewlib-arm-none-eabi
          - platform: ch32v006
            board: generic
            build: DEBUG
            toolchain-packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
          - platform: ch32v006
            board: generic
            build: RELEASE
            toolchain-packages: gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        uses: ./.github/actions/build-platform
        with:
          platform: ${{ matrix.platform }}
          board: ${{ matrix.board }}
          build: ${{ matrix.build }}
          toolchain-packages: ${{ matrix.toolchain-packages }}

      # Fails on warnings absent from the checked-in baseline (one-way
      # ratchet). Runs inside the build job because handing the log to a
      # separate job would need actions/download-artifact, which is outside
      # the allowed action set.
      - name: Warning ratchet
        run: >
          python3 ci/warn_ratchet.py
          --log '${{ steps.build.outputs.log }}'
          --baseline 'ci/warn_baseline_${{ matrix.platform }}.txt'

      # Golden gate (BLOCKING): byte-exact reference build integrity.
      # make validate checks grbl.hex MD5 against the golden hash
      # (79af184e67b27defd27a39309ac53563, see grbl/platform/common/chk.py).
      - name: Golden gate (make validate)
        if: matrix.platform == 'atmega328p'
        run: make -C grbl/platform/atmega328p validate
