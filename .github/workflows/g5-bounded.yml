name: G5 bounded accuracy
on:
  push:
    branches: [wip/g5-gauss-reuse]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm: [fixed16, gauss]
        mode: [g94, g93]
    steps:
      - name: Install frozen AVR toolchain
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed git make diffutils bash python gcc
          a=https://archive.archlinux.org/packages/a
          pacman -U --noconfirm \
            $a/avr-binutils/avr-binutils-2.47-1-x86_64.pkg.tar.zst \
            $a/avr-gcc/avr-gcc-16.2.0-1-x86_64.pkg.tar.zst \
            $a/avr-libc/avr-libc-2.3.2-4-any.pkg.tar.zst
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - name: Validate oracle and syntax
        shell: bash
        run: |
          bash -n tb/compare/bounded.sh
          python3 -I tb/compare/bounded.py --control
      - name: Binary32 local-chord model
        shell: bash
        run: |
          mkdir -p raw
          nice -n 19 gcc -O2 -ffast-math tb/compare/gauss_float.c -lm -o /tmp/gauss-float
          /tmp/gauss-float | tee raw/float-model.txt
      - name: Build four-case images
        shell: bash
        run: bash tb/compare/bounded.sh '${{ matrix.arm }}' '${{ matrix.mode }}' build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-build-${{ matrix.arm }}-${{ matrix.mode }}
          path: raw/
  run:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        arm: [fixed16, gauss]
        mode: [g94, g93]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 3d29650a1e1c121717cbedfbccc8fcdb8c0ea2dc
          path: harness
      - uses: actions/download-artifact@v4
        with:
          name: bounded-build-${{ matrix.arm }}-${{ matrix.mode }}
          path: raw
      - name: Install simulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends simavr
      - name: Run four cases
        run: bash tb/compare/bounded.sh '${{ matrix.arm }}' '${{ matrix.mode }}' run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-${{ matrix.arm }}-${{ matrix.mode }}
          path: raw/
