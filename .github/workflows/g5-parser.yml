name: G5 bounded native and static comparison

on:
  workflow_dispatch:
    inputs:
      family:
        description: 'Frozen native/static comparison; no AVR execution'
        type: choice
        options: [parser, rms, chords]
        default: parser
  workflow_call:
    inputs:
      family:
        type: string
        default: parser

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FAMILY: ${{ inputs.family || 'parser' }}

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: ${{ inputs.family || 'parser' }} native identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.family == 'rms' || inputs.family == 'chords') && '210e4a4a3b529eaea927ff85fe79d91a74f9b1aa' || '452c70dc7809edb2e16e03a6707c197fc535fbbd' }}
          path: ${{ (inputs.family == 'rms' || inputs.family == 'chords') && 'frame' || 'select' }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.family == 'chords' && 'ce43674a91d032926d16756e00acef8906a89eb3' || inputs.family == 'rms' && 'c1e462a4a83bb8e429b3b723bc26153ae30f5b5e' || '210e4a4a3b529eaea927ff85fe79d91a74f9b1aa' }}
          path: ${{ inputs.family == 'chords' && 'chords' || inputs.family == 'rms' && 'rms' || 'frame' }}
      - name: Raw outputs, flag-off and actual G93 identity, vector diagnostics
        run: |
          set -euo pipefail
          case "$FAMILY" in
            parser) reference=select; candidate=frame ;;
            rms) reference=frame; candidate=rms ;;
            chords) reference=frame; candidate=chords ;;
            *) exit 2 ;;
          esac
          timeout 600 nice -n 19 python3 -I tb/compare/parser_native.py \
            --reference "$reference" --candidate "$candidate" --family "$FAMILY" --output raw/native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.FAMILY }}-native
          path: raw/native

  avr:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [g94, g93]
    name: ${{ inputs.family || 'parser' }} AVR 16.2 ${{ matrix.mode }}
    steps:
      - name: Pinned AVR tools
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git make diffutils bash python curl
          a=https://archive.archlinux.org/packages/a
          mkdir -p "$RUNNER_TEMP/avr-packages"
          for package in \
            avr-binutils/avr-binutils-2.47-1-x86_64.pkg.tar.zst \
            avr-gcc/avr-gcc-16.2.0-1-x86_64.pkg.tar.zst \
            avr-libc/avr-libc-2.3.2-4-any.pkg.tar.zst; do
            curl --fail --location --ipv4 --retry 2 --retry-delay 5 \
              --connect-timeout 20 --max-time 120 \
              --output "$RUNNER_TEMP/avr-packages/${package##*/}" "$a/$package"
          done
          pacman -U --noconfirm "$RUNNER_TEMP"/avr-packages/*.pkg.tar.zst
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.family == 'rms' || inputs.family == 'chords') && '210e4a4a3b529eaea927ff85fe79d91a74f9b1aa' || '452c70dc7809edb2e16e03a6707c197fc535fbbd' }}
          path: ${{ (inputs.family == 'rms' || inputs.family == 'chords') && 'frame' || 'select' }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.family == 'chords' && 'ce43674a91d032926d16756e00acef8906a89eb3' || inputs.family == 'rms' && 'c1e462a4a83bb8e429b3b723bc26153ae30f5b5e' || '210e4a4a3b529eaea927ff85fe79d91a74f9b1aa' }}
          path: ${{ inputs.family == 'chords' && 'chords' || inputs.family == 'rms' && 'rms' || 'frame' }}
      - name: Normal production links, flag-off identity and static overflow evidence
        run: timeout 900 nice -n 19 bash tb/compare/build_select.sh '${{ matrix.mode }}' "$FAMILY"
      - name: Require boot-region fit; static inspection does not waive overflow
        run: |
          set -euo pipefail
          python3 -I tb/compare/check_select_fit.py raw --mode '${{ matrix.mode }}' --family "$FAMILY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.FAMILY }}-avr-${{ matrix.mode }}
          path: raw
