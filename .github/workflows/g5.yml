name: G5 Z aim prototype

on:
  push:
    branches-ignore: [wip/g5-fixed24, wip/g5-fixed24-local, wip/g5-local-riskmax, wip/g5-local-zero]
  pull_request:

defaults:
  run:
    shell: bash

env:
  OPTIONS: |
    base
    tol -DBEZIER_SIGMA=settings.arc_tolerance
    tol-zt -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=1
    tol-zl -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=2
    tol-zl-g93 -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=2 -DBEZIER_EXACT_INVERSE_TIME
    tol-za -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=3
    tol-za-g93 -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=3 -DBEZIER_EXACT_INVERSE_TIME
    tol-za-loose -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=3 -DBEZIER_Z_LOOSE
    tol-za-loose-g93 -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=3 -DBEZIER_Z_LOOSE -DBEZIER_EXACT_INVERSE_TIME
    tol-za-zs -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=3 -DBEZIER_Z_SIGMA=0.01f
    tol-za-zs-g93 -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=3 -DBEZIER_Z_SIGMA=0.01f -DBEZIER_EXACT_INVERSE_TIME

jobs:
  avr:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - gcc: '7.3.0'
          - gcc: '15.2.0'
          - gcc: '16.2.0'
            container: 'archlinux:latest'
    name: avr-gcc ${{ matrix.gcc }}
    container: ${{ matrix.container }}
    steps:
      - name: Arch packages
        if: matrix.container
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed git make diffutils bash python
          a=https://archive.archlinux.org/packages/a
          pacman -U --noconfirm \
            $a/avr-binutils/avr-binutils-2.47-1-x86_64.pkg.tar.zst \
            $a/avr-gcc/avr-gcc-16.2.0-1-x86_64.pkg.tar.zst \
            $a/avr-libc/avr-libc-2.3.2-4-any.pkg.tar.zst
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ubuntu avr-gcc
        if: matrix.gcc == '7.3.0'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-avr avr-libc binutils-avr
      - name: ZakKemble avr-gcc
        if: matrix.gcc == '15.2.0'
        run: |
          set -euo pipefail
          name=avr-gcc-${{ matrix.gcc }}-x64-linux
          curl -fsSL "https://github.com/ZakKemble/avr-gcc-build/releases/download/v${{ matrix.gcc }}-1/$name.tar.bz2" | tar -xj -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
      - name: Previous modes match 5601c12, 37235f2 and f4f8349
        run: |
          set -euo pipefail
          avr-gcc --version | head -1
          # Modes 0 and 1 are as in 5601c12. Mode 2 is as in 37235f2, where its first pass
          # came to end at the target. Mode 3 is as in f4f8349: BEZIER_Z_SIGMA, added since,
          # changes nothing unless set.
          git worktree add -q ../before 5601c12
          git worktree add -q ../before2 37235f2
          git worktree add -q ../before3 f4f8349
          cc=$(make -s --eval 'print-compile: ; @echo $(COMPILE)' print-compile)
          mkdir -p raw
          for splines in '-DENABLE_CUBIC_SPLINES' '-DENABLE_CUBIC_SPLINES -DENABLE_QUADRATIC_SPLINES'; do
            while read -r name opt; do
              case $name in
                ''|tol-za-zs*) continue ;;
                tol-za*) ref=../before3; was=f4f8349 ;;
                tol-zl*) ref=../before2; was=37235f2 ;;
                *) ref=../before; was=5601c12 ;;
              esac
              make -s clean
              make -s -C $ref clean
              make -s -C $ref COMPILE="$cc $splines $opt" > /dev/null
              make -s COMPILE="$cc $splines $opt" > /dev/null
              cmp $ref/grbl.hex grbl.hex
              printf '%s %s identical to %s\n' "$splines" "$name" "$was" | tee -a raw/identity.txt
            done <<< "$OPTIONS"
          done
      - name: Production sizes and AVR benches
        run: |
          set -euo pipefail
          mkdir -p raw elf
          cc=$(make -s --eval 'print-compile: ; @echo $(COMPILE)' print-compile)
          defs='-DENABLE_CUBIC_SPLINES -DENABLE_QUADRATIC_SPLINES'
          printf 'option flash delta ram free_ram boot_margin fits_32k\n' > raw/sizes.txt
          while read -r name opt; do
            [ -n "$name" ] || continue
            make -s clean
            if make -s COMPILE="$cc $defs $opt" > raw/firmware-$name.log 2>&1; then
              set -- $(avr-size build/main.elf | tail -1)
              flash=$(($1+$2)); ram=$(($2+$3))
              if [ "$name" = base ]; then base=$flash; fi
              fit=yes; [ "$flash" -le 32768 ] || fit=no
              printf '%s %d %+d %d %d %d %s\n' "$name" "$flash" "$((flash-base))" "$ram" "$((2048-ram))" "$((32256-flash))" "$fit" >> raw/sizes.txt
              mkdir -p elf/$name
              printf '%d\n' "$((2048-ram))" > elf/$name/free-ram.txt
              cp build/main.elf elf/$name/firmware.elf
            else
              printf '%s link-failed\n' "$name" >> raw/sizes.txt
              printf '::warning::Production %s does not link; see raw firmware log\n' "$name"
            fi
            for target in all dump dyn; do
              extra=''; [ "$target" != dyn ] || extra=-DTB_DYN_SPLINES_ONLY
              # Separate BUILD avoids reusing objects with different test-only defines.
              dir=build/$name-$target
              mkdir -p elf/$name
              if make -s -C tb/avr BUILD="$dir" DEFS="$defs $opt $extra" "$target" > raw/build-$name-$target.log 2>&1; then
                image=$target; [ "$image" != all ] || image=bench
                cp tb/avr/$dir/$image.elf elf/$name/
                avr-size tb/avr/$dir/$image.elf >> raw/bench-sizes.txt
              else
                printf '::warning::%s %s unavailable (build or 32768-byte limit); log retained\n' "$name" "$target"
                printf '%s %s unavailable\n' "$name" "$target" >> raw/unavailable.txt
              fi
            done
          done <<< "$OPTIONS"
          cat raw/sizes.txt
          cat raw/sizes.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Shared core corpus with Z
        run: |
          set -euo pipefail
          for name in za za-g93; do
            mode=G94; extra=''
            if [ "$name" = za-g93 ]; then mode=G93; extra=-DBEZIER_EXACT_INVERSE_TIME; fi
            # Shared protocol: tol .002, final XY budget and direct Wang SIGMA .004.
            python3 -I tb/compare/render.py tb/compare/core.in raw/core-$name.txt --z --mode "$mode"
            defs="-DENABLE_CUBIC_SPLINES -DENABLE_QUADRATIC_SPLINES -DBEZIER_Z_LINEAR=3 -DTB_ARC_TOLERANCE=.002f -DBEZIER_SIGMA=.004f $extra"
            mkdir -p elf/core-$name
            for target in all dump; do
              if make -s -C tb/avr BUILD=build/core-$name LINES=../../raw/core-$name.txt DEFS="$defs" "$target" > raw/build-core-$name-$target.log 2>&1; then
                image=$target; [ "$image" != all ] || image=bench
                cp tb/avr/build/core-$name/$image.elf elf/core-$name/
              else
                printf 'core-%s %s unavailable\n' "$name" "$target" >> raw/unavailable.txt
              fi
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avr-${{ matrix.gcc }}
          path: |
            elf
            raw

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Vectors and previous modes
        run: |
          set -euo pipefail
          timeout 1800 nice -n 19 make -s -C tb/host test > host-test.txt 2>&1
          cat host-test.txt
      - name: Mutation testing
        run: |
          set -euo pipefail
          timeout 1800 nice -n 19 tb/host/mutate.sh > mutants.txt 2>&1
          cat mutants.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-tests
          path: |
            host-test.txt
            mutants.txt

  random:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tol: ['.002', '.01', '.1']
    steps:
      - uses: actions/checkout@v4
      - name: Same random curves in each Z mode
        run: |
          set -euo pipefail
          modes='1 2 3 3-loose'
          # One more column where $12 is tightest: Z held to five times as much.
          [ '${{ matrix.tol }}' != .002 ] || modes="$modes 3-zs"
          for mode in $modes; do
            opt="-DBEZIER_SIGMA=settings.arc_tolerance -DTB_ARC_TOLERANCE=${{ matrix.tol }}f -DBEZIER_Z_LINEAR=${mode%%-*}"
            case $mode in *-loose) opt="$opt -DBEZIER_Z_LOOSE" ;; *-zs) opt="$opt -DBEZIER_Z_SIGMA=0.01f" ;; esac
            make -s -C tb/host BUILD=build/random-$mode OPT="$opt" > build-$mode.txt 2>&1
            timeout 1800 nice -n 19 tb/host/build/random-$mode/tb --random 5000 1 > random-$mode.txt 2>&1
            cat random-$mode.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: random-${{ matrix.tol }}
          path: |
            build-*.txt
            random-*.txt

  simavr:
    needs: avr
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: ['7.3.0', '15.2.0', '16.2.0']
        opt: [base, tol, tol-zt, tol-zl, tol-zl-g93, tol-za, tol-za-g93, tol-za-loose, tol-za-loose-g93, tol-za-zs, tol-za-zs-g93]
    name: simavr ${{ matrix.gcc }} ${{ matrix.opt }}
    env:
      ELF: input/elf/${{ matrix.opt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: avr-${{ matrix.gcc }}
          path: input
      - name: Install simavr
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends simavr
      - name: Segments cycles targets and motion
        run: |
          set -euo pipefail
          mkdir -p raw
          opt=$(printf '%s\n' "$OPTIONS" | sed -n 's/^${{ matrix.opt }} //p')
          make -s -C tb/host OPT="$opt" > raw/host-build.txt 2>&1
          tb/host/build/tb --hash tb/avr/lines.txt > raw/host-hash.txt
          for image in bench dump dyn; do
            if [ ! -f "$ELF/$image.elf" ]; then
              printf 'NOT VERIFIED: %s unavailable\n' "$image" | tee -a raw/unavailable.txt
              continue
            fi
            timeout 1200 nice -n 19 simavr -m atmega328p -f 16000000 "$ELF/$image.elf" > raw/$image-simavr.txt 2>&1
            sed 's/\x1b\[[0-9;]*m//g; s/\.*$//' raw/$image-simavr.txt > raw/$image.txt
            grep -qx done raw/$image.txt
            if [ "$image" = dump ]; then
              tb/host/build/tb --dump tb/avr/lines.txt raw/dump.txt > raw/dump-check.txt
              cat raw/dump-check.txt
            elif [ "$image" = bench ]; then
              calib=$(awk '$1 == "calib" {print $2}' raw/bench.txt)
              test "$calib" -ge 1000000 && test "$calib" -le 1001000
              cat raw/bench.txt
            else
              cat raw/dyn.txt
              # A build with a Z word also runs the programs with a steep Z.
              steep=''; case '${{ matrix.opt }}' in *-z*) steep=--steep ;; esac
              python3 -I tb/avr/check_dyn.py raw/dyn.txt $steep > raw/dyn-check.txt
              cat raw/dyn-check.txt
              if [ -f "$ELF/free-ram.txt" ]; then
                free=$(cat "$ELF/free-ram.txt")
                stack=$(awk '$1 == "stack" {print $2}' raw/dyn.txt)
                printf 'stack %s free %s margin %s\n' "$stack" "$free" "$((free-stack))" | tee raw/stack-margin.txt
                test "$stack" -lt "$free"
              else
                printf 'NOT VERIFIED: production RAM unavailable\n' | tee -a raw/unavailable.txt
              fi
            fi
          done
      - name: Shared corpus targets with Z and G93
        if: ${{ !cancelled() && (matrix.opt == 'tol-za' || matrix.opt == 'tol-za-g93') }}
        run: |
          set -euo pipefail
          mkdir -p raw
          case '${{ matrix.opt }}' in
            tol-za) core=za ;; tol-za-g93) core=za-g93 ;; *) exit 0 ;;
          esac
          extra=''; mode=G94
          if [ "$core" = za-g93 ]; then extra=-DBEZIER_EXACT_INVERSE_TIME; mode=G93; fi
          cp "input/raw/core-$core.txt" raw/core.txt
          if [ -f "input/elf/core-$core/dump.elf" ]; then
            make -s -C tb/host BUILD=build/core OPT="-DBEZIER_Z_LINEAR=3 -DTB_ARC_TOLERANCE=.002f -DBEZIER_SIGMA=.004f -DTB_XY_BUDGET=.004f $extra" > raw/core-host-build.txt 2>&1
            timeout 600 nice -n 19 simavr -m atmega328p -f 16000000 "input/elf/core-$core/dump.elf" > raw/core-simavr.txt 2>&1
            sed 's/\x1b\[[0-9;]*m//g; s/\.*$//' raw/core-simavr.txt > raw/core-dump.txt
            grep -qx done raw/core-dump.txt
            tb/host/build/core/tb --dump-strict raw/core.txt raw/core-dump.txt > raw/core-check.txt
            cat raw/core-check.txt
          else
            printf 'NOT VERIFIED: core dump unavailable\n' | tee -a raw/unavailable.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simavr-${{ matrix.gcc }}-${{ matrix.opt }}
          path: raw
