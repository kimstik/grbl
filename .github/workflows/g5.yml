name: G5 build

on:
  push:
  pull_request:

# The options of the spline section of config.h in every combination: a name,
# then the flags added to G5+G5.1.
env:
  OPTIONS: |
    base
    tol -DBEZIER_SIGMA=settings.arc_tolerance
    zt -DBEZIER_Z_LINEAR=1
    zl -DBEZIER_Z_LINEAR=2
    zl-g93 -DBEZIER_Z_LINEAR=2 -DBEZIER_EXACT_INVERSE_TIME
    tol-zt -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=1
    tol-zl -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=2
    tol-zl-g93 -DBEZIER_SIGMA=settings.arc_tolerance -DBEZIER_Z_LINEAR=2 -DBEZIER_EXACT_INVERSE_TIME

jobs:
  avr:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # 7.3.0: Ubuntu package. 15.2.0: ZakKemble/avr-gcc-build prebuilt.
      # 16.2.0: Arch Linux packages pinned from the Arch archive.
      # 17-*: GCC weekly snapshot built here and cached.
      matrix:
        include:
          - gcc: '7.3.0'
          - gcc: '15.2.0'
          - gcc: '16.2.0'
            container: 'archlinux:latest'
          - gcc: '17-20261115'
            snapshot: true
    name: avr-gcc ${{ matrix.gcc }}
    container: ${{ matrix.container }}
    steps:
      # The Arch image lacks git, which checkout needs for full history.
      - name: Arch packages
        if: matrix.container
        run: |
          pacman -Syu --noconfirm --needed git make diffutils
          a=https://archive.archlinux.org/packages/a
          pacman -U --noconfirm \
            $a/avr-binutils/avr-binutils-2.47-1-x86_64.pkg.tar.zst \
            $a/avr-gcc/avr-gcc-16.2.0-1-x86_64.pkg.tar.zst \
            $a/avr-libc/avr-libc-2.3.2-4-any.pkg.tar.zst
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ubuntu avr-gcc
        if: matrix.gcc == '7.3.0'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-avr avr-libc binutils-avr

      - name: ZakKemble avr-gcc
        if: matrix.gcc == '15.2.0'
        run: |
          name=avr-gcc-${{ matrix.gcc }}-x64-linux
          curl -fsSL "https://github.com/ZakKemble/avr-gcc-build/releases/download/v${{ matrix.gcc }}-1/$name.tar.bz2" | tar -xj -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"

      - name: Snapshot avr-gcc cache
        if: matrix.snapshot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/avr-gcc-snapshot
          key: avr-gcc-${{ matrix.gcc }}-${{ hashFiles('.github/build-avr-gcc.sh') }}

      - name: Snapshot avr-gcc build
        if: matrix.snapshot && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgmp-dev libmpfr-dev libmpc-dev texinfo
          sh .github/build-avr-gcc.sh ~/avr-gcc-snapshot ${{ matrix.gcc }}

      - name: Snapshot avr-gcc path
        if: matrix.snapshot
        run: echo ~/avr-gcc-snapshot/bin >> "$GITHUB_PATH"

      - name: Toolchain version
        run: avr-gcc --version | head -1

      # Splines disabled with the stock flags must produce the vanilla binary.
      - name: Splines off matches master
        run: |
          STOCK='avr-gcc -Wall -Os -DF_CPU=16000000 -mmcu=atmega328p -I. -ffunction-sections -flto'
          git worktree add -q ../master origin/master
          make -s -C ../master COMPILE="$STOCK"
          make -s COMPILE="$STOCK"
          md5sum ../master/grbl.hex grbl.hex
          cmp ../master/grbl.hex grbl.hex

      # With none of the spline options set the firmware is the one before them.
      - name: Options off match 73c589e
        run: |
          BRANCH=$(make -s --eval 'print-compile: ; @echo $(COMPILE)' print-compile)
          git worktree add -q ../before 73c589e
          for def in '-DENABLE_CUBIC_SPLINES' '-DENABLE_CUBIC_SPLINES -DENABLE_QUADRATIC_SPLINES'; do
            make -s clean
            make -s -C ../before clean
            make -s -C ../before COMPILE="$BRANCH $def"
            make -s COMPILE="$BRANCH $def"
            md5sum ../before/grbl.hex grbl.hex
            cmp ../before/grbl.hex grbl.hex
          done

      # ATmega328P: 32768 bytes flash, 32256 with the 512-byte Uno bootloader.
      # Then the spline options on top of G5+G5.1 with the branch flags, and
      # the free RAM of each for the stack check of the simavr job.
      - name: Size matrix
        run: |
          STOCK='avr-gcc -Wall -Os -DF_CPU=16000000 -mmcu=atmega328p -I. -ffunction-sections -flto'
          BRANCH=$(make -s --eval 'print-compile: ; @echo $(COMPILE)' print-compile)
          G5='-DENABLE_CUBIC_SPLINES'
          G51='-DENABLE_CUBIC_SPLINES -DENABLE_QUADRATIC_SPLINES'
          printf '### avr-gcc ${{ matrix.gcc }}\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| flags | splines | flash | ram | free (32256) |\n|---|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          for flags in stock branch; do
            if [ $flags = stock ]; then cc="$STOCK"; else cc="$BRANCH"; fi
            for cfg in off G5 G5+G5.1; do
              case $cfg in off) def='' ;; G5) def="$G5" ;; *) def="$G51" ;; esac
              make -s clean
              if ! make -s COMPILE="$cc $def" > /dev/null 2>&1; then
                printf '| %s | %s | link fails (> 32768) | | |\n' $flags $cfg | tee -a "$GITHUB_STEP_SUMMARY"
                [ $flags = branch ] && [ $cfg = G5+G5.1 ] && exit 1
                continue
              fi
              set --$(avr-size --format=berkeley build/main.elf | tail -1)
              flash=$(( $1 + $2 )); ram=$(( $2 + $3 ))
              printf '| %s | %s | %d | %d | %d |\n' $flags $cfg $flash $ram $(( 32256 - flash )) | tee -a "$GITHUB_STEP_SUMMARY"
              if [ $flags = branch ] && [ $cfg = G5+G5.1 ] && [ $flash -gt 32256 ]; then
                echo "::error::G5+G5.1 with branch flags does not fit 32256 bytes"
                exit 1
              fi
            done
          done
          printf '\n| options | flash | delta | ram | free (32256) |\n|---|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$OPTIONS" | while read -r name opt; do
            make -s clean
            if ! make -s COMPILE="$BRANCH $G51 $opt" > /dev/null 2>&1; then
              printf '| %s | link fails (> 32768) | | | |\n' $name | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            set -- $(avr-size --format=berkeley build/main.elf | tail -1)
            flash=$(( $1 + $2 )); ram=$(( $2 + $3 ))
            [ $name = base ] && base=$flash
            printf '| %s | %d | %+d | %d | %d |\n' $name $flash $(( flash - base )) $ram $(( 32256 - flash )) | tee -a "$GITHUB_STEP_SUMMARY"
            mkdir -p tb/avr/build/$name
            echo $(( 2048 - ram )) > tb/avr/build/$name/free-ram.txt
          done

      - name: Experimental circle fitter size
        run: |
          BRANCH=$(make -s --eval 'print-compile: ; @echo $(COMPILE)' print-compile)
          mkdir -p build/circle
          CC="$BRANCH -DENABLE_CUBIC_SPLINES -DENABLE_QUADRATIC_SPLINES -DBEZIER_CIRCLE_FIT"
          if ! make -s BUILDDIR=build/circle COMPILE="$CC" build/circle/main.elf; then
            echo "::warning::normal circle link failed; the next link is SIZE-ONLY and must not be flashed"
            make -s BUILDDIR=build/circle COMPILE="$CC -Wl,--defsym=__TEXT_REGION_LENGTH__=65536" build/circle/main.elf
          fi
          set -- $(avr-size --format=berkeley build/circle/main.elf | tail -1)
          flash=$(( $1 + $2 ))
          printf 'circle-size text=%s data=%s bss=%s flash=%s spare32256=%s\n' "$1" "$2" "$3" "$flash" "$((32256-flash))"
          printf '\n### circle prototype\n\nflash=%s, data=%s, bss=%s, spare(32256)=%s\n' "$flash" "$2" "$3" "$((32256-flash))" >> "$GITHUB_STEP_SUMMARY"
          if [ "$flash" -gt 32768 ]; then
            echo "::warning::circle prototype does not fit ATmega328P ($flash bytes)"
          fi

      - name: Generator-only microbench builds
        run: |
          for gen in wang circle; do
            opt='-DBEZIER_SIGMA=0.004f'
            [ "$gen" = circle ] && opt='-DBEZIER_CIRCLE_FIT'
            make -s -C tb/avr BUILD=build/micro-$gen DEFS="-DENABLE_CUBIC_SPLINES -DENABLE_QUADRATIC_SPLINES $opt" micro
          done

      # The simavr benches of every option combination, branch flags.
      - name: Build AVR benches
        run: |
          printf '%s' "$OPTIONS" | while read -r name opt; do
            set -- BUILD=build/$name DEFS="-DENABLE_CUBIC_SPLINES -DENABLE_QUADRATIC_SPLINES $opt"
            make -s -C tb/avr "$@"
            make -s -C tb/avr "$@" dyn || echo "::warning::dyn.elf ($name) does not build or fit with avr-gcc ${{ matrix.gcc }}"
            make -s -C tb/avr "$@" dump
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.gcc }}
          path: |
            tb/avr/build/*/bench.elf
            tb/avr/build/*/dyn.elf
            tb/avr/build/*/dump.elf
            tb/avr/build/*/micro.elf
            tb/avr/build/*/free-ram.txt

  # Correctness on the PC: vectors, random curves, G5-only build, the spline
  # options, mutants.
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bench
        run: make -s -j4 -O -C tb/host test
      - name: Circle fitter C smoke
        run: |
          make -s -C tb/host BUILD=build-circle OPT=-DBEZIER_CIRCLE_FIT
          tb/host/build-circle/tb tb/host/vectors/circle.vec
          tb/host/build-circle/tb --random 1000 1
      - name: Mutation testing
        run: tb/host/mutate.sh

  micro:
    needs: avr
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: ['7.3.0', '15.2.0', '16.2.0', '17-20261115']
    name: generator micro ${{ matrix.gcc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bench-${{ matrix.gcc }}
          path: elf
      - name: Install simavr
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends simavr
      - name: Isolated generator cost
        shell: bash
        run: |
          set -euo pipefail
          printf '### Isolated generator, avr-gcc ${{ matrix.gcc }}\n\nNo parser, planner, serial ISR or stepper. Stack figures apply only to this microbenchmark.\n\n' >> "$GITHUB_STEP_SUMMARY"
          for gen in wang circle; do
            timeout 600 simavr -m atmega328p -f 16000000 elf/micro-$gen/micro.elf 2>&1 | sed 's/\x1b\[[0-9;]*m//g; s/\.*$//' > micro-$gen.txt
            grep -qx done micro-$gen.txt
            python -I tb/compare/micro_assert.py micro-$gen.txt --generator "$gen"
            cat micro-$gen.txt
            printf '\n%s: case status chords total dry first gap hash endpoint realtime untouched\n\n```\n' "$gen" >> "$GITHUB_STEP_SUMMARY"
            cat micro-$gen.txt >> "$GITHUB_STEP_SUMMARY"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: micro-${{ matrix.gcc }}
          path: micro-*.txt

  circle-common:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and simulator
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-avr avr-libc binutils-avr simavr
      - name: Common captured nets, timed and dump images, both complete polylines
        shell: bash
        run: |
          set -euo pipefail
          python -I tb/compare/audit.py --self-test
          timeout 1200 nice -n 19 python -I tb/compare/circle_check.py /usr/bin/simavr --audit > circle-common.txt 2>&1
          cat circle-common.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circle-common
          path: |
            circle-common.txt
            .tmp/circle-fit/common
          include-hidden-files: true

  # Every compiler's benches under simavr, for every option combination:
  # cycles, stack, segments against the host bench built with the same options,
  # and the real main loop with the stepper running.
  simavr:
    needs: avr
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        gcc: ['7.3.0', '15.2.0', '16.2.0', '17-20261115']
        opt: [base, tol, zt, zl, zl-g93, tol-zt, tol-zl, tol-zl-g93]
    name: simavr ${{ matrix.gcc }} ${{ matrix.opt }}
    env:
      ELF: elf/${{ matrix.opt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bench-${{ matrix.gcc }}
          path: elf
      - name: Install simavr
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends simavr
      - name: Segments and cycles
        run: |
          make -s -C tb/host OPT="$(printf '%s' "$OPTIONS" | sed -n 's/^${{ matrix.opt }} //p')" > /dev/null
          tb/host/build/tb --hash tb/avr/lines.txt > host.txt
          timeout 600 simavr -m atmega328p -f 16000000 $ELF/bench.elf 2>&1 |
            sed 's/\x1b\[[0-9;]*m//g; s/\.*$//' > avr.txt
          cat avr.txt
          grep -qx done avr.txt
          calib=$(awk '$1 == "calib" { print $2 }' avr.txt)
          if [ "$calib" -lt 1000000 ] || [ "$calib" -gt 1001000 ]; then
            echo "::error::cycle counter calibration off: $calib for 1000000"; exit 1
          fi
          {
            printf '\n### avr-gcc ${{ matrix.gcc }} ${{ matrix.opt }}, stack never touched: %s bytes\n\n' "$(awk '$1 == "stack" { print $2 }' avr.txt)"
            printf '| line | status | seg | total | planner | gen | gen/seg | first | worst gap | end exact | non-finite | = host |\n'
            printf '|---|---|---|---|---|---|---|---|---|---|---|---|\n'
            awk 'NR == FNR { h[$1] = $2 " " $3 " " $4; next }
                 NF == 11 { printf "| %s | %s | %s | %s | %s | %s | %s | %s | %s | %s | %s | %s |\n",
                   $1, $2, $3, $4, $5, $6, ($3 ? int($6 / $3) : "-"), $7, $8, $9, $10,
                   (h[$1] == $2 " " $3 " " $11) ? "yes" : "**no**" }' host.txt avr.txt
          } >> "$GITHUB_STEP_SUMMARY"
          awk 'NR == FNR { h[$1] = $2 " " $3 " " $4; next }
               NF == 11 && h[$1] != $2 " " $3 " " $11 { print "::warning::segments differ from host on " $1 }' host.txt avr.txt
      # The AVR segment targets themselves against the curve model: hashes
      # that differ from the host must still be within the tolerance.
      - name: Segment targets
        run: |
          timeout 600 simavr -m atmega328p -f 16000000 $ELF/dump.elf 2>&1 |
            sed 's/\x1b\[[0-9;]*m//g; s/\.*$//' > dump.txt
          grep -qx done dump.txt
          tb/host/build/tb --dump tb/avr/lines.txt dump.txt | tee dump-check.txt
          {
            printf '\n### segment targets, avr-gcc ${{ matrix.gcc }} ${{ matrix.opt }}\n\n```\n'
            cat dump-check.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -1 dump-check.txt | grep -q ', 0 failed$'
      # Planner fill while streaming curves, feed hold and resume, stack depth
      # with the stepper and serial interrupts.
      - name: Motion
        if: ${{ hashFiles(format('elf/{0}/dyn.elf', matrix.opt)) != '' }}
        run: |
          timeout 1200 simavr -m atmega328p -f 16000000 $ELF/dyn.elf 2>&1 |
            sed 's/\x1b\[[0-9;]*m//g; s/\.*$//' | grep -v '^ok$' > motion.txt
          cat motion.txt
          grep -qx done motion.txt
          free=$(cat $ELF/free-ram.txt)
          stack=$(awk '$1 == "stack" { print $2 }' motion.txt)
          {
            printf '\n### simavr motion, avr-gcc ${{ matrix.gcc }} ${{ matrix.opt }}\n\n'
            printf 'Most stack used %d bytes, firmware free RAM %d bytes.\n\n' $stack $free
            printf '| kind | size um | F | accel | lat ms | seg | t ms | feed | peak | min | min full | low | stops | cut | cut F | dx | dy | stack |\n'
            printf '|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n'
            awk '$1 == "run" { $1 = ""; $8 = ""; gsub(/ +/, " | "); print $0 " |" }' motion.txt
            printf '\n| hold ms | state | x steps | state at resume | suspend | dx | dy | dz | t ms | stack |\n'
            printf '|---|---|---|---|---|---|---|---|---|---|\n'
            awk '$1 == "hold" { $1 = ""; gsub(/ +/, " | "); print $0 " |" }' motion.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $stack -gt $free ]; then
            echo "::warning::stack $stack bytes exceeds the firmware's free RAM $free bytes"
          fi
